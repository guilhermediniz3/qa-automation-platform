server.port=8081

# PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/managerqa
spring.datasource.username=postgres
spring.datasource.password=123

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# As entidades usam os schemas people, operational e tech. Hibernate deve criá-los
# antes de executar o ddl-auto para as tabelas.
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Garante os schemas exigidos pelas entidades antes do Hibernate executar o ddl-auto.
spring.sql.init.mode=always

# JWT
api.security.token.secret=my-secret-key-from-videos

# Flyway
spring.flyway.enabled=false

# E-mail e recuperação de senha (configure os valores no ambiente, nunca no Git)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@managerqa.local}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false
