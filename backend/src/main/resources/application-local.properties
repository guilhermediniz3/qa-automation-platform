
server.port=8081


spring.datasource.url=jdbc:postgresql://localhost:5432/testersuite
spring.datasource.username=postgres
spring.datasource.password=123


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always


api.security.token.secret=my-secret-key-from-video

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@managerqa.local}
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173}
management.health.mail.enabled=false
